<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Gradiente sutil en el fondo -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>

    <!-- Glow filter para el texto principal -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanlines (clip de fondo decorativo) -->
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0,0,0,0.06)"/>
    </pattern>
  </defs>

  <!-- Fondo base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Scanlines decorativas encima del fondo -->
  <rect width="1200" height="630" fill="url(#scanlines)"/>

  <!-- Línea de acento superior -->
  <rect x="0" y="0" width="1200" height="3" fill="#00ffff" opacity="0.8"/>

  <!-- Borde lateral izquierdo neón -->
  <rect x="80" y="60" width="3" height="510" fill="#00ffff" opacity="0.5"/>

  <!-- Cabecera tipo sistema -->
  <text x="108" y="115"
    font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
    font-size="18"
    fill="#39ff14"
    letter-spacing="2"
    text-anchor="start">// amilkardominguez.com</text>

  <!-- Nombre — Amilkar -->
  <text x="108" y="270"
    font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
    font-size="96"
    font-weight="700"
    fill="#e6f1ff"
    letter-spacing="-3"
    filter="url(#glow-cyan)"
    text-anchor="start">Amilkar</text>

  <!-- Nombre — Dominguez (acento cian) -->
  <text x="108" y="370"
    font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
    font-size="96"
    font-weight="700"
    fill="#00ffff"
    letter-spacing="-3"
    filter="url(#glow-cyan)"
    text-anchor="start">Dominguez</text>

  <!-- Separador -->
  <rect x="108" y="400" width="320" height="2" fill="#00ffff" opacity="0.4"/>

  <!-- Tagline -->
  <text x="108" y="450"
    font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
    font-size="26"
    fill="#8b96a8"
    letter-spacing="0"
    text-anchor="start">Desarrollador de software</text>

  <!-- URL en la base -->
  <text x="108" y="550"
    font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
    font-size="20"
    fill="#39ff14"
    letter-spacing="1"
    text-anchor="start">amilkardominguez.com</text>

  <!-- Decoración: puntos de colores esquina inferior derecha -->
  <circle cx="1060" cy="540" r="8" fill="#ff00ff" opacity="0.7"/>
  <circle cx="1090" cy="540" r="8" fill="#ffb000" opacity="0.7"/>
  <circle cx="1120" cy="540" r="8" fill="#39ff14" opacity="0.7"/>

  <!-- Línea de acento inferior -->
  <rect x="0" y="627" width="1200" height="3" fill="#ff00ff" opacity="0.5"/>
</svg>
